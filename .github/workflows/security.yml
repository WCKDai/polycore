name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check semgrep==1.182.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan secrets, code, dependencies and workflows
        run: ./.agents/bin/eng security --json
