name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4

jobs:
  # Pull requests hold no secret: a pull request runs its own copy of this workflow, so it could read
  # any secret its run can see, and a compile cache it could write would reach main's builds. Its
  # build cache comes from GitHub's cache, which is scoped per branch: a pull request restores main's
  # entries but can only write its own. Pushes to main run the same job to keep those entries fresh.
  ubuntu:
    name: Rust / wasm (Ubuntu)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: polycore-pr-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format, check, Clippy, tests, wasm and dependency boundary
        run: cargo xtask ci

  full:
    name: Rust / wasm (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: polycore-full-${{ matrix.os }}
          cache-on-failure: true
          cache-targets: false
      - name: Format, check, Clippy, tests, wasm and dependency boundary
        run: cargo xtask ci

  trusted:
    name: Rust / wasm (trusted Linux)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, rust-16, trusted]
    timeout-minutes: 60
    # The R2 write key is a secret of the `r2-cache-write` environment, which only main may use.
    environment: r2-cache-write
    env:
      R2_READY: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' }}
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' && 'sccache' || '' }}
      SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: ${{ vars.SCCACHE_S3_USE_SSL }}
      SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install sccache
        if: env.R2_READY == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: polycore-trusted-linux
          cache-on-failure: true
          cache-targets: false
      - name: Format, check, Clippy, tests, wasm and dependency boundary
        run: cargo xtask ci

  property-tests:
    name: Boolean properties (nightly)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, rust-16, trusted]
    timeout-minutes: 90
    # The R2 write key is a secret of the `r2-cache-write` environment, which only main may use.
    environment: r2-cache-write
    env:
      R2_READY: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' }}
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_CONFIGURED == 'true' && 'sccache' || '' }}
      SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: ${{ vars.SCCACHE_S3_USE_SSL }}
      SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install sccache
        if: env.R2_READY == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: polycore-properties-linux
          cache-on-failure: true
      - run: cargo xtask property-test
        env:
          PROPTEST_CASES: 200
